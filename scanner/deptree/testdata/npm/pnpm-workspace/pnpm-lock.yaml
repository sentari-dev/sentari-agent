lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      typescript:
        specifier: ^5.4.0
        version: 5.4.5

  packages/api:
    dependencies:
      express:
        specifier: ^4.18.0
        version: 4.18.2

  packages/web:
    dependencies:
      react:
        specifier: ^18.2.0
        version: 18.2.0

packages:

  typescript@5.4.5:
    resolution: {integrity: sha512-typescript}

  express@4.18.2:
    resolution: {integrity: sha512-express}

  qs@6.11.0:
    resolution: {integrity: sha512-qs}

  react@18.2.0:
    resolution: {integrity: sha512-react}

  loose-envify@1.4.0:
    resolution: {integrity: sha512-loose}

snapshots:

  typescript@5.4.5: {}

  express@4.18.2:
    dependencies:
      qs: 6.11.0

  qs@6.11.0: {}

  react@18.2.0:
    dependencies:
      loose-envify: 1.4.0

  loose-envify@1.4.0: {}
